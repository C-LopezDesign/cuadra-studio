<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <style>
    rect{fill:#16203A}
    .accent{fill:#4E7A1E}
    @media (prefers-color-scheme:dark){rect{fill:#E7EAF2}.accent{fill:#A8CF6A}}
  </style>
  <rect x="0" y="0" width="10" height="10" rx="1"/>
  <rect class="accent" x="12" y="0" width="10" height="10" rx="1"/>
  <rect x="0" y="12" width="10" height="10" rx="1"/>
  <rect x="12" y="12" width="10" height="10" rx="1"/>
</svg>
